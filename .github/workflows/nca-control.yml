name: NCA Sprint 016 | Signed Queue and Stop Gate

on:
  push:
    branches: [main]
    paths:
      - 'nca_control/**'
      - 'tests/test_nca_control*.py'
      - '.github/workflows/nca-control.yml'
  pull_request:
    paths:
      - 'nca_control/**'
      - 'tests/test_nca_control*.py'
      - '.github/workflows/nca-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-control:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned signing dependency
        run: python -m pip install -r nca_control/requirements.txt
      - name: Compile control package
        run: python -m compileall -q nca_control
      - name: Run real Ed25519 and durable queue adversarial suite
        run: python -m unittest discover -s tests -p 'test_nca_control.py' -v
