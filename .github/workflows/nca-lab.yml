name: NCA synthetic gate simulation
on:
  pull_request:
    paths:
      - 'nca_lab/**'
      - 'tests/test_simulator.py'
      - '.github/workflows/nca-lab.yml'
  push:
    branches: [main]
    paths:
      - 'nca_lab/**'
      - 'tests/test_simulator.py'
      - '.github/workflows/nca-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 nca_lab/simulator.py --cases 10000 --seed 20261030
