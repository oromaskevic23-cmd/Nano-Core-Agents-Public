name: NCA always-on lab - one real local model cycle
on:
  pull_request:
    paths:
      - '.github/workflows/nca-always-on-real-once.yml'
      - 'tools/nca_always_on_real_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nca-always-on-real-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-local-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MODELS: /tmp/imperial-nca-always-on-models
      IMPERIAL_NCA_ALWAYS_ON_LAB: ALLOW_LOCAL_SYNTHETIC_ONLY
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install lab dependencies and run signed-control tests
        run: |
          python -m pip install -r nca_control/requirements.txt
          python -m pip install -r nca_browser/browser-requirements.txt
          python -m unittest discover -s tests -p 'test_nca_control*.py' -v
      - name: Install Chromium for the synthetic offline page
        run: python -m playwright install --with-deps chromium
      - name: Install checksum-pinned Ollama
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          curl --proto '=https' --tlsv1.2 -fL --retry 2 --connect-timeout 15 --max-time 480 \
            'https://github.com/ollama/ollama/releases/download/v0.40.11/ollama-linux-amd64.tar.zst' \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          echo "7bedab90dd122661be78798e9f0edf37fccf0cccf2699d2c58ea1a3afdc04b6d  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          test -x "$RUNNER_TEMP/ollama/bin/ollama"
      - name: Start loopback model, submit one signed job and stop the supervisor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --noproxy '*' -fsS 'http://127.0.0.1:11434/api/tags' >/dev/null; then break; fi
            sleep 1
          done
          curl --noproxy '*' -fsS 'http://127.0.0.1:11434/api/tags' >/dev/null
          timeout 300 "$RUNNER_TEMP/ollama/bin/ollama" pull smollm2:1.7b-instruct-q4_K_M
          PYTHONPATH=. timeout 270 python tools/nca_always_on_real_smoke.py
