name: NCA Factory | Offline release gate

on:
  push:
    branches: [main]
    paths:
      - 'nca_factory/**'
      - 'tests/test_nca_factory.py'
      - '.github/workflows/nca-factory.yml'
  pull_request:
    paths:
      - 'nca_factory/**'
      - 'tests/test_nca_factory.py'
      - '.github/workflows/nca-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-factory:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q nca_factory tests/test_nca_factory.py
      - name: Lifecycle, expiry, stop, quality and adversarial unit tests
        run: python -m unittest discover -s tests -p 'test_nca_factory.py' -v
      - name: Full reproducible offline demo
        run: python -m nca_factory
